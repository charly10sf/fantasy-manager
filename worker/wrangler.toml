# El Worker de Fantasy Manager: lo que necesita la versión web y un navegador no puede hacer solo (hablar con
# LaLiga y con las webs de datos, que no dejan llamarlas desde otra página) y el código para entrar en el
# ordenador con la sesión de la app. Lo publica la GitHub Action «Worker» (.github/workflows/worker.yml), que
# también crea el almacén de los códigos (VINCULOS) y lo añade aquí al publicar.
name = "fantasy-manager"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

# El dueño de la app (Carlos): el número de su cuenta de LaLiga. Con él lee y contesta desde la app los avisos de
# fallos de todos. No da acceso a nada por sí solo: el Worker comprueba con LaLiga, con la sesión de quien llama,
# que de verdad es esa cuenta. Si existe el secreto FM_ADMINS, manda el secreto.
[vars]
ADMINS = "667015"
# El paso al ordenador con la sesión sin cerrar (la app antes de la 0.7a). Cuando en «Quién usa la app» no quede nadie por
# debajo de la 0.7a, ponlo a "no" (revisión total, C6).
FORMATO_VIEJO = "si"

# Cada 5 min lanza el workflow «Bot X» en main (scheduled en src/index.js), porque el cron de GitHub Actions no dispara.
# Necesita el secreto BOT_DISPATCH_TOKEN, que worker.yml copia del secreto de Actions del mismo nombre.
[triggers]
# Y de 00:13 a 00:30 de Madrid, cada minuto, lo lanza solo con el mercado (el cron va en UTC: 22:13-22:30 en verano y
# 23:13-23:30 en invierno; scheduled en src/index.js mira la hora de Madrid y descarta la franja que no toca).
crons = ["*/5 * * * *", "13-30 22,23 * * *"]

# El QR para entrar en el ordenador (0.6.12): un objeto por QR, que ve al momento lo que deja la app (el KV puede
# tardar hasta un minuto entre centros de Cloudflare). Si Cloudflare no deja crearlo, worker.yml lo quita y publica sin él.
[[durable_objects.bindings]]
name = "QR"
class_name = "Emparejar"

[[migrations]]
tag = "qr-1"
new_sqlite_classes = ["Emparejar"]

# Los frenos por minuto (revisión total, C1): el Rate Limiting de Workers, que entra en el plan gratis. Cuenta por centro de
# Cloudflare y es aproximado; el Worker lleva además su contador en memoria y los topes por día en el Durable Object.
# Si Cloudflare no deja crearlos, worker.yml los quita y publica sin ellos (el Worker sigue con los de memoria).
[[ratelimits]]
name = "FRENO_ESCRIBIR"
namespace_id = "7101"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "FRENO_LEER"
namespace_id = "7102"
simple = { limit = 45, period = 60 }
