plugins {
    id 'com.android.application'
}

// La firma: la clave vive en android/firma.p12, cifrada con el secreto ANDROID_CLAVE de GitHub.
// Sin ese secreto, la Action firma con una clave de prueba solo para comprobar que compila.
def rutaFirma = System.getenv('FIRMA_RUTA')
def claveFirma = System.getenv('FIRMA_CLAVE')
// La de Google Play va con otra clave, la de subida (la que Google conoce): vive cifrada con el secreto PLAY_CLAVE en
// la rama «claves» del repositorio y la Action la deja en SUBIDA_RUTA. Sin el secreto, una de prueba.
def rutaSubida = System.getenv('SUBIDA_RUTA')
def claveSubida = System.getenv('SUBIDA_CLAVE')

// Los anuncios (AdMob, solo en la versión de Google Play). Con fm.anunciosReales=false (gradle.properties) van los
// bloques de prueba de Google, que salen marcados como «Test Ad» y no pagan: así nadie de la prueba cerrada puede
// tocar un anuncio de verdad (Google cierra la cuenta por clics propios). Para producción, a true.
def anunciosReales = (System.getenv('ANUNCIOS_REALES') ?: (project.findProperty('fm.anunciosReales') ?: 'false')).toString() == 'true'
def bloque = { real, prueba -> ("\"" + (anunciosReales ? real : prueba) + "\"").toString() }

android {
    namespace 'es.fantasymanager.app'
    compileSdk 36

    defaultConfig {
        applicationId 'es.fantasymanager.app'
        minSdk 26
        // Google Play pide apuntar a Android 16 (API 36) desde el 31 de agosto de 2026
        targetSdk 36
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        // el mismo número que la web (web/js/version.js); la Action lo saca de ahí
        versionName System.getenv('VERSION_NAME') ?: "0.0.${System.getenv('VERSION_CODE') ?: '0'}"
        // la huella de la parte Android (la calcula la Action con .github/paquete.py): la web publicada solo se baja
        // sin reinstalar si es para esta misma parte Android (AlDia.java)
        buildConfigField 'String', 'NATIVO', "\"${System.getenv('NATIVO') ?: 'local'}\""
    }

    signingConfigs {
        release {
            if (rutaFirma && claveFirma) {
                storeFile file(rutaFirma)
                storePassword claveFirma
                keyAlias 'fantasy'
                keyPassword claveFirma
                storeType 'pkcs12'
            }
        }
        subida {
            if (rutaSubida && claveSubida) {
                storeFile file(rutaSubida)
                storePassword claveSubida
                keyAlias 'subida'
                keyPassword claveSubida
                storeType 'pkcs12'
            }
        }
    }

    // dos versiones de la misma app: la de GitHub (se baja e instala sola la versión nueva desde el aviso) y la
    // de Google Play (sin eso: Google no deja actualizarse por fuera de la tienda; la actualiza Play)
    flavorDimensions 'canal'
    productFlavors {
        github {
            dimension 'canal'
            if (rutaFirma && claveFirma) signingConfig signingConfigs.release
            buildConfigField 'String', 'BANNER', '""'
            buildConfigField 'String', 'BONIFICADO', '""'
        }
        play {
            dimension 'canal'
            if (rutaSubida && claveSubida) signingConfig signingConfigs.subida
            // Banner Inferior y Bonificado Desbloqueo (creados el 23 oct en AdMob); los de prueba, los de Google
            buildConfigField 'String', 'BANNER', bloque('ca-app-pub-3175956326240112/5804998548', 'ca-app-pub-3940256099942544/9214589741')
            buildConfigField 'String', 'BONIFICADO', bloque('ca-app-pub-3175956326240112/4365466356', 'ca-app-pub-3940256099942544/5224354917')
        }
    }

    // la web va dentro de la app: web/ del repositorio se copia tal cual a los assets
    sourceSets {
        main {
            assets.srcDirs += file('../../web')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures { buildConfig true }

    // que los avisos de lint no paren la compilación
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // la página de LaLiga para entrar (con Google) se abre en una pestaña de Chrome dentro de la app
    implementation 'androidx.browser:browser:1.8.0'
    // sirve la web de los assets con https, para que funcionen el cifrado y el almacenamiento del navegador
    implementation 'androidx.webkit:webkit:1.12.1'
    // si el DNS del móvil no encuentra una dirección (bloqueadores, DNS privado), se pregunta por https a Cloudflare o Google
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0'
    // la IA trabajando con la app cerrada: Android la despierta cada 3 horas y tras el cambio de mercado
    implementation 'androidx.work:work-runtime:2.9.1'
    // el hueco de las barras del sistema y del teclado (Android 15 y 16 dibujan la app de borde a borde)
    implementation 'androidx.core:core:1.13.1'
    // solo en la versión de Google Play: los anuncios (AdMob) y el consentimiento de la UE para mostrarlos (UMP)
    playImplementation 'com.google.android.gms:play-services-ads:25.5.0'
    playImplementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    // AdMob trae Guava solo para ejecutarse y una ListenableFuture vacía para compilar; WorkManager (el trabajo en
    // segundo plano) necesita la de verdad al compilar: la misma Guava que trae AdMob
    playImplementation 'com.google.guava:guava:31.1-android'
}
