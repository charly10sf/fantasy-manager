# El proyecto de Xcode de la app de iOS. Lo genera XcodeGen (`xcodegen generate` dentro de ios/): el .xcodeproj no se
# guarda en el repo ni se toca a mano. Antes hay que dejar la web en ios/Recursos/web con `python3 ios/preparar.py`
# (lo hace .github/workflows/ios.yml).
name: FantasyManager
options:
  bundleIdPrefix: es.fantasymanager
  deploymentTarget:
    iOS: "16.4"
  developmentLanguage: es
  createIntermediateGroups: true
  generateEmptyDirectories: true
# Los anuncios: el SDK de Google (AdMob) y el del consentimiento de la UE (UMP), por Swift Package Manager
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "13.13.0"
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: "3.1.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # los pone ios.yml: la versión de la web (sin letra, que Apple solo admite números), el número de compilación,
    # la versión tal cual (con letra) y la huella de la parte de iOS (paquete.py, «nativoIos»)
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
    FM_VERSION: "local"
    FM_NATIVO: "local"
targets:
  FantasyManager:
    type: application
    platform: iOS
    sources:
      - path: App/Fuentes
      # el JS del puente (window.FantasyApp), que se inyecta en cada página
      - path: App/Puente
        buildPhase: resources
      # lo que la app cuenta de sí misma a las pruebas del simulador: solo se compila en Debug (#if DEBUG)
      - path: Sonda
      - path: App/Assets.xcassets
      - path: App/PrivacyInfo.xcprivacy
      # la web de web/ (solo lo que va en paquete.json), como carpeta tal cual dentro de la app
      - path: Recursos/web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.fantasymanager.app
        PRODUCT_NAME: FantasyManager
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
        SWIFT_EMIT_LOC_STRINGS: NO
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        # los avisos del servidor (push) y los avisos urgentes (el clausulazo sin alarma del sistema)
        CODE_SIGN_ENTITLEMENTS: App/FantasyManager.entitlements
      # Los anuncios. En las compilaciones de prueba (Debug: el simulador de GitHub), la app y los bloques de prueba de
      # Google, que salen marcados como «Test Ad» y no pagan (lo mismo que hace bloque() en android/app/build.gradle con
      # fm.anunciosReales=false). En la que se publica (Release), los de verdad de la cuenta de Fantasy Manager
      configs:
        Debug:
          FM_ADMOB_APP: "ca-app-pub-3940256099942544~1458002511"
          FM_BONIFICADO: "ca-app-pub-3940256099942544/1712485313"
          FM_INTERSTICIAL: "ca-app-pub-3940256099942544/4411468910"
          FM_APERTURA: "ca-app-pub-3940256099942544/5575463023"
        Release:
          FM_ADMOB_APP: "ca-app-pub-3175956326240112~7887955530"
          FM_BONIFICADO: "ca-app-pub-3175956326240112/9065819186"
          FM_INTERSTICIAL: "ca-app-pub-3175956326240112/9792190459"
          FM_APERTURA: "ca-app-pub-3175956326240112/6191730483"
    dependencies:
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
  FantasyManagerPruebas:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Pruebas
    dependencies:
      - target: FantasyManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.fantasymanager.app.pruebas
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FantasyManager
        CODE_SIGN_STYLE: Automatic
schemes:
  FantasyManager:
    build:
      targets:
        FantasyManager: all
        FantasyManagerPruebas: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FantasyManagerPruebas
    archive:
      config: Release
