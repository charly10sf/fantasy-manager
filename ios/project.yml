# El proyecto de Xcode de la app de iOS. Lo genera XcodeGen (`xcodegen generate` dentro de ios/): el .xcodeproj no se
# guarda en el repo ni se toca a mano. Antes hay que dejar la web en ios/Recursos/web con `python3 ios/preparar.py`
# (lo hace .github/workflows/ios.yml).
name: FantasyManager
options:
  bundleIdPrefix: es.fantasymanager
  deploymentTarget:
    iOS: "16.4"
  developmentLanguage: es
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # los pone ios.yml: la versión de la web (sin letra, que Apple solo admite números), el número de compilación,
    # la versión tal cual (con letra) y la huella de la parte de iOS (paquete.py, «nativoIos»)
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
    FM_VERSION: "local"
    FM_NATIVO: "local"
targets:
  FantasyManager:
    type: application
    platform: iOS
    sources:
      - path: App/Fuentes
      - path: App/Assets.xcassets
      - path: App/PrivacyInfo.xcprivacy
      # la web de web/ (solo lo que va en paquete.json), como carpeta tal cual dentro de la app
      - path: Recursos/web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.fantasymanager.app
        PRODUCT_NAME: FantasyManager
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
        SWIFT_EMIT_LOC_STRINGS: NO
  FantasyManagerPruebas:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Pruebas
    dependencies:
      - target: FantasyManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.fantasymanager.app.pruebas
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FantasyManager
        CODE_SIGN_STYLE: Automatic
schemes:
  FantasyManager:
    build:
      targets:
        FantasyManager: all
        FantasyManagerPruebas: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FantasyManagerPruebas
    archive:
      config: Release
