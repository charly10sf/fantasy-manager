<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Maqueta: overhaul de Fantasy Manager</title>
  <link rel="stylesheet" href="css/app.css">
  <!-- TEMPORAL (overhaul, 11 nov): no es parte de la app y no se publica. Es la app de verdad con la liga de ejemplo
       (funciones top abiertas) y, encima, tres direcciones de diseño en CSS: solo cambian cómo se ve, nada de lo que hace
       ni de lo que dice. La barra de abajo cambia la dirección y la pantalla (Hoy, la ficha de un jugador y Mercado). -->
  <style>
    .maq { position: fixed; z-index: 9999; left: 8px; right: 8px; bottom: 8px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 auto; max-width: 760px;
      padding: 7px; border-radius: 16px; background: rgba(10, 10, 12, 0.94); border: 1px solid #2a2a31; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5); }
    .maq::-webkit-scrollbar { display: none; }
    .maq button { flex: none; padding: 7px 11px; border-radius: 99px; border: 1px solid #2a2a31; background: #141417; color: #c3bec5; font: 600 13px 'Barlow'; letter-spacing: 0; text-transform: none; }
    .maq button[aria-pressed="true"] { background: #d6162f; border-color: #d6162f; color: #fff; }
    .maq b { flex: none; align-self: center; font: 700 12px 'Barlow'; color: #948f9b; padding: 0 2px 0 6px; }
    .hoja { padding-bottom: 96px !important; }
    #vista { padding-bottom: 150px; }

    /* =====================================================================================================
       A · NOCHE DE ESTADIO. Calma y premium: el negro hace de fondo y el rojo solo marca lo que se toca o lo que
       urge. Superficies en tres niveles en vez de bordes, títulos en minúscula, píldoras finas y todo más aireado.
       ===================================================================================================== */
    html.dA { --fondo: #050506; --plano: #111114; --plano2: #19191e; --plano3: #24242b; --linea: rgba(255, 255, 255, 0.06); --texto2: #bdb8c0; --apagado: #8e8994; }
    html.dA .sup { border-bottom-color: transparent; box-shadow: 0 1px 0 rgba(255, 255, 255, 0.04); }
    html.dA .titulo { font: 700 32px/1.05 var(--cond); text-transform: none; letter-spacing: -0.2px; }
    html.dA .sec { margin: 34px 0 12px; }
    html.dA .sec h2, html.dA .fase-tx b { font: 700 19px/1.15 'Barlow'; text-transform: none; letter-spacing: 0; }
    html.dA .marcador { background: var(--plano); border: 0; border-radius: 22px; box-shadow: inset 0 2px 0 var(--rojo); padding: 16px 18px 18px; }
    html.dA .marcador .col { border-left-color: var(--linea); }
    html.dA .marcador .col .et, html.dA .marcador .fila-j { letter-spacing: 0.2px; text-transform: none; font-size: 13px; }
    html.dA .paso2 { border: 0; border-radius: 18px; background: var(--plano); box-shadow: inset 2px 0 0 var(--plano3); }
    html.dA .paso2.vender { box-shadow: inset 2px 0 0 var(--sube); }
    html.dA .paso2.clausular, html.dA .paso2.pujar, html.dA .paso2.comprar { box-shadow: inset 2px 0 0 var(--rojo); }
    html.dA .paso2 > summary { padding: 14px 12px 14px 14px; }
    html.dA .accion-t, html.dA .pill { border-radius: 999px; letter-spacing: 0.2px; text-transform: none; font: 600 12.5px 'Barlow'; padding: 3px 9px; }
    html.dA .pill { background: transparent; box-shadow: inset 0 0 0 1px var(--plano3); }
    html.dA .pill.abierta { box-shadow: inset 0 0 0 1px rgba(238, 28, 60, 0.45); background: transparent; }
    html.dA .pill.bien, html.dA .pill.chollo { box-shadow: inset 0 0 0 1px rgba(47, 209, 143, 0.4); background: transparent; }
    html.dA .pill.mal { box-shadow: inset 0 0 0 1px rgba(255, 111, 97, 0.4); background: transparent; }
    html.dA .pill.pronto, html.dA .pill.duda, html.dA .pill.vende { box-shadow: inset 0 0 0 1px rgba(255, 197, 71, 0.4); background: transparent; }
    html.dA .fila { padding: 15px 0; }
    html.dA .fila-n { font-weight: 600; font-size: 16.5px; }
    html.dA .tabs-in { border: 0; border-radius: 999px; background: var(--plano); }
    html.dA .tabs button { border-radius: 999px; }
    html.dA .tabs button.activo { background: var(--plano3); box-shadow: none; }
    html.dA .btn { border-radius: 999px; text-transform: none; letter-spacing: 0; }
    html.dA .hoja { border-top: 0; border-radius: 28px 28px 0 0; box-shadow: 0 -16px 48px rgba(0, 0, 0, 0.65); }
    html.dA .ficha-top h2 { text-transform: none; letter-spacing: -0.3px; font-size: 34px; }
    html.dA .val-card { border: 0; background: var(--plano2); border-radius: 20px; }
    html.dA .aviso-ficha.av { border-left-width: 2px; background: var(--plano2); border-radius: 14px; }
    /* palabras en Barlow, cifras en Barlow Condensed: los títulos dejan de gritar y los números mandan */
    html.dA .plan-titular { font: 700 25px/1.18 'Barlow'; letter-spacing: -0.3px; }
    html.dA .titulo, html.dA .ficha-top h2 { font-family: 'Barlow'; font-weight: 700; letter-spacing: -0.5px; }
    html.dA .titulo { font-size: 28px; }
    html.dA .ficha-top h2 { font-size: 28px; }
    html.dA .fase-n { background: var(--plano3); color: var(--texto); }
    html.dA .nav { background: #050506; border-top-color: rgba(255, 255, 255, 0.05); }
    html.dA .nav button.activo::before { left: 44%; right: 44%; height: 3px; border-radius: 3px; top: auto; bottom: 6px; }

    /* =====================================================================================================
       B · CROMO. El álbum de cromos: cada jugador es una pieza con el color de su puesto (portero, defensa, medio,
       delantero), caras más grandes y el marcador como un cromo especial con el borde de oro y rojo.
       ===================================================================================================== */
    html.dB { --plano: #141318; --plano2: #1c1b22; --plano3: #2a2832; --linea: #24232b; }
    html.dB .fila { --pc: var(--plano3); border: 0; border-radius: 18px; padding: 12px 12px; margin-bottom: 8px;
      background: linear-gradient(90deg, color-mix(in srgb, var(--pc) 13%, var(--plano)) 0%, var(--plano) 45%); }
    html.dB .fila:has(.ava.p1) { --pc: var(--por); } html.dB .fila:has(.ava.p2) { --pc: var(--def); }
    html.dB .fila:has(.ava.p3) { --pc: var(--med); } html.dB .fila:has(.ava.p4) { --pc: var(--del); }
    html.dB .fila .ava, html.dB .fila .ava.m { width: 54px; height: 54px; }
    html.dB .ava::after { box-shadow: inset 0 0 0 3px var(--plano3); }
    html.dB .ava.p1::after { box-shadow: inset 0 0 0 3px var(--por); } html.dB .ava.p2::after { box-shadow: inset 0 0 0 3px var(--def); }
    html.dB .ava.p3::after { box-shadow: inset 0 0 0 3px var(--med); } html.dB .ava.p4::after { box-shadow: inset 0 0 0 3px var(--del); }
    html.dB .titulo { font-size: 40px; letter-spacing: 0.5px; }
    html.dB .marcador { border: 1.5px solid transparent; border-radius: 22px;
      background: linear-gradient(160deg, #1d1016 0%, #121116 60%) padding-box, linear-gradient(135deg, #ffc547 0%, #ee1c3c 45%, #5a0b1a 75%, #ffc547 100%) border-box; }
    html.dB .paso2 { border-radius: 18px; border-left-width: 0; background: var(--plano); border-color: transparent; }
    html.dB .paso2 .ava { width: 50px; height: 50px; }
    html.dB .paso2 { --pc: var(--plano3); background: linear-gradient(90deg, color-mix(in srgb, var(--pc) 13%, var(--plano)) 0%, var(--plano) 50%); }
    html.dB .paso2:has(.ava.p1) { --pc: var(--por); } html.dB .paso2:has(.ava.p2) { --pc: var(--def); }
    html.dB .paso2:has(.ava.p3) { --pc: var(--med); } html.dB .paso2:has(.ava.p4) { --pc: var(--del); }
    html.dB .fase-n { background: linear-gradient(135deg, #ffc547, #ee1c3c); color: #fff; }
    html.dB .pill, html.dB .accion-t { border-radius: 999px; }
    html.dB .tabs-in { background: none; border: 0; gap: 8px; padding: 0; }
    html.dB .tabs button { border-radius: 999px; box-shadow: inset 0 0 0 1px var(--plano3); }
    html.dB .tabs button.activo { background: var(--rojo-btn); color: #fff; box-shadow: none; }
    html.dB .btn { border-radius: 16px; }
    html.dB .ficha-top .ava.g, html.dB .ficha-top .ava { width: 104px; height: 104px; }
    html.dB .ficha-top .ava::after { box-shadow: inset 0 0 0 4px var(--plano3); }
    html.dB .ficha-top .ava.p1::after { box-shadow: inset 0 0 0 4px var(--por); } html.dB .ficha-top .ava.p2::after { box-shadow: inset 0 0 0 4px var(--def); }
    html.dB .ficha-top .ava.p3::after { box-shadow: inset 0 0 0 4px var(--med); } html.dB .ficha-top .ava.p4::after { box-shadow: inset 0 0 0 4px var(--del); }
    html.dB .ficha-top h2 { font-size: 40px; }
    html.dB .val-card { border-radius: 22px; border: 0; background: linear-gradient(180deg, var(--plano2), var(--plano)); }
    html.dB .aviso-ficha.av { border-radius: 16px; }
    html.dB .hoja { border-radius: 26px 26px 0 0; }

    /* =====================================================================================================
       C · DIRECTO. Como el rótulo de un partido en la tele: denso, cifras grandes y alineadas, esquinas casi rectas y
       el rojo como franja inclinada en los títulos. Cabe más en cada pantalla.
       ===================================================================================================== */
    html.dC { --fondo: #000; --plano: #0d0d10; --plano2: #141418; --plano3: #22222a; --linea: #1b1b21; }
    html.dC .titulo { font-size: 28px; display: flex; align-items: center; gap: 10px; }
    html.dC .titulo::before { content: ''; flex: none; width: 9px; height: 22px; background: var(--rojo); transform: skewX(-14deg); }
    html.dC .sec { margin: 24px 0 8px; }
    html.dC .sec h2 { font-size: 18px; display: flex; align-items: center; gap: 8px; }
    html.dC .sec h2::before { content: ''; width: 5px; height: 15px; background: var(--rojo); transform: skewX(-14deg); }
    html.dC .marcador { border-radius: 4px; border: 0; background: var(--plano); box-shadow: inset 6px 0 0 var(--rojo); padding: 12px 14px 14px 20px; }
    html.dC .marcador .col .v { font-size: 34px; }
    html.dC .plan-titular { font: 700 26px/1.05 var(--cond); text-transform: uppercase; letter-spacing: 0.2px; }
    html.dC .fase-n { border-radius: 2px; transform: skewX(-12deg); }
    html.dC .fase-tx b { font-size: 17px; }
    html.dC .marcador .col .et, html.dC .marcador .fila-j { color: var(--texto2); }
    html.dC .paso2 { border-radius: 4px; border-top: 0; border-right: 0; border-bottom: 1px solid var(--linea); background: var(--plano); margin-bottom: 2px; }
    html.dC .paso2 > summary { padding: 8px 8px 8px 10px; }
    html.dC .paso2 .ava { width: 40px; height: 40px; }
    html.dC .pp-imp { font-size: 20px; }
    html.dC .pill, html.dC .accion-t { border-radius: 2px; font: 700 11.5px 'Barlow'; letter-spacing: 0.4px; text-transform: uppercase; padding: 3px 6px; }
    html.dC .fila { padding: 9px 0; gap: 10px; }
    html.dC .fila .ava.m, html.dC .fila .ava { width: 38px; height: 38px; }
    html.dC .fila-n { font-size: 15.5px; }
    html.dC .fila-s { font-size: 13px; -webkit-line-clamp: 1; }
    html.dC .fila-d .v { font-size: 21px; }
    html.dC .tabs { margin-bottom: 8px; }
    html.dC .tabs-in { background: none; border: 0; border-bottom: 1px solid var(--linea); border-radius: 0; padding: 0; }
    html.dC .tabs button { border-radius: 0; min-height: 42px; }
    html.dC .tabs button.activo { background: none; box-shadow: inset 0 -3px 0 var(--rojo); }
    html.dC .btn { border-radius: 4px; }
    html.dC .hoja { border-radius: 10px 10px 0 0; }
    html.dC .ficha-top h2 { font-size: 30px; }
    html.dC .val-card { border-radius: 4px; border-color: var(--linea); }
    html.dC .aviso-ficha.av { border-radius: 4px; padding: 9px 12px; }
    html.dC .nav { background: #000; }
    html.dC .nav button.activo::before { left: 0; right: 0; border-radius: 0; }

    /* =====================================================================================================
       ELEGIDA (Carlos, 11 nov, 06:47): la base de A (superficies, píldoras finas, el rojo solo en lo que se toca), la letra
       «fantasy» de B en los títulos (condensada, mayúsculas, grande) y de C la franja roja inclinada delante de los
       títulos y los números de las fases del plan en un bloque rojo inclinado. Se aplica con las clases dA y dE juntas.
       ===================================================================================================== */
    html.dE .titulo, html.dE .ficha-top h2 { font-family: var(--cond); font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; }
    html.dE .titulo { font-size: 36px; display: flex; align-items: center; gap: 10px; }
    html.dE .ficha-top h2 { font-size: 38px; }
    html.dE .titulo::before { content: ''; flex: none; width: 9px; height: 26px; background: var(--rojo); transform: skewX(-14deg); }
    html.dE .plan-titular { font: 700 30px/1.05 var(--cond); text-transform: uppercase; letter-spacing: 0.3px; }
    html.dE .sec h2 { font: 700 20px/1.1 var(--cond); text-transform: uppercase; letter-spacing: 0.4px; display: flex; align-items: center; gap: 8px; }
    html.dE .sec h2::before { content: ''; flex: none; width: 5px; height: 16px; background: var(--rojo); transform: skewX(-14deg); }
    html.dE .fase-n { border-radius: 3px; transform: skewX(-12deg); background: var(--rojo); color: #fff; }
    html.dE .fase-tx b { font: 700 18px/1.15 var(--cond); text-transform: uppercase; letter-spacing: 0.3px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="maq" id="maq"></div>
  <script>
    // la liga de ejemplo sin el tutorial y con las funciones top abiertas (limites.json con «bloqueadas» vacío)
    try { localStorage.setItem('fm-demo', 'true'); localStorage.setItem('fm-tour', '1'); } catch (e) { /* nada */ }
    const f0 = window.fetch.bind(window);
    window.fetch = async (u, o) => {
      const r = await f0(u, o);
      if (!/limites\.json/.test(String((u && u.url) || u))) return r;
      try { const j = await r.clone().json(); j.bloqueadas = []; return new Response(JSON.stringify(j), { status: 200, headers: { 'content-type': 'application/json' } }); } catch (e) { return r; }
    };
    const q = new URLSearchParams(location.search);
    { const d0 = (q.get('d') || 'E').toUpperCase(); document.documentElement.classList.add(`d${d0}`); if (d0 === 'E') document.documentElement.classList.add('dA'); }
  </script>
  <script type="module" src="js/app.js"></script>
  <script type="module">
    const esperar = () => new Promise((ok) => { const t = setInterval(() => { if (window.S && window.S.M) { clearInterval(t); ok(); } }, 200); });
    await esperar();
    const S = window.S, M = S.M, q = new URLSearchParams(location.search);
    let dir = (q.get('d') || 'E').toUpperCase(), pant = q.get('p') || 'hoy';
    const clic = (sel) => { const b = document.querySelector(sel); if (b) b.click(); };
    // la ficha: el tuyo que más vale (con avisos, valor de cada día y jornadas)
    const suyo = [...M.mias].filter((x) => x.j.pos !== 5).sort((a, b) => b.j.valor - a.j.valor)[0];
    function ver() {
      clic('[data-accion="cerrarHoja"]');
      setTimeout(() => {
        if (pant === 'ficha') { clic('[data-ir="hoy"]'); const b = document.createElement('button'); b.dataset.j = suyo.pid; document.body.append(b); b.click(); b.remove(); }
        else { clic(`[data-ir="${pant}"]`); window.scrollTo(0, 0); }
      }, 80);
    }
    function barra() {
      document.documentElement.classList.remove('dA', 'dB', 'dC', 'dE', 'd0'); document.documentElement.classList.add(`d${dir}`); if (dir === 'E') document.documentElement.classList.add('dA');
      document.getElementById('maq').innerHTML = `<b>Dirección</b>${[['E', 'Elegida (A + B + C)'], ['0', 'Ahora'], ['A', 'A · Noche de estadio'], ['B', 'B · Cromo'], ['C', 'C · Directo']].map(([k, t]) => `<button data-d="${k}" aria-pressed="${dir === k}">${t}</button>`).join('')}`
        + `<b>Pantalla</b>${[['hoy', 'Hoy'], ['ficha', 'Ficha de un jugador'], ['mercado', 'Mercado']].map(([k, t]) => `<button data-p="${k}" aria-pressed="${pant === k}">${t}</button>`).join('')}`;
      history.replaceState(null, '', `?d=${dir}&p=${pant}`);
    }
    document.getElementById('maq').addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.d) { dir = b.dataset.d; barra(); return; }
      if (b.dataset.p) { pant = b.dataset.p; barra(); ver(); }
    });
    barra();
    ver();
  </script>
</body>
</html>
