name: Previa prueba
on:
  push:
    branches: [pruebas-previa]
permissions:
  contents: read
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix bot --no-audit --no-fund
      - name: simulacro
        run: |
          mkdir -p salida
          node bot/ejecutar.mjs --modo=simulacro --tipos=previa --previa-acabados=1 --forzar=1 --tarjetas=1 --salida-tarjetas=salida > salida/a.txt 2>&1 || true
          node bot/ejecutar.mjs --modo=simulacro --jornada=11 --tipos=resumen --ventanas=0 --tarjetas=1 --salida-tarjetas=salida > salida/b.txt 2>&1 || true
          cat salida/a.txt salida/b.txt | sed 's/^/@@ /'
          ls salida | sed 's/^/@@F /'
          for f in resumen-11-mejores previa-113 onces-104; do [ -f salida/$f.png ] && base64 -w 6000 salida/$f.png | awk -v n=$f '{print "@@C " n " " NR " " $0}'; done
