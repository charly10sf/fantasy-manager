# Publica el Worker de Fantasy Manager (worker/) en Cloudflare: lo que usa la versión web para hablar con LaLiga
# y las webs de datos, y los códigos para entrar en el ordenador con la sesión de la app.
# Hace falta en GitHub (Settings > Secrets and variables > Actions), de su cuenta de Cloudflare (no la de GrowFolio):
#   CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID
# El almacén de los códigos (KV «VINCULOS») se crea solo la primera vez si el token tiene permiso; si no, los
# códigos van en la caché del Worker. En el mismo almacén van los avisos de fallos.
# Opcional: FM_ADMINS (si no, vale el ADMINS de wrangler.toml), el número de tu cuenta de LaLiga (sale en la app, en Ajustes > Diagnóstico). Con él, esa
# cuenta ve en la app los avisos de fallos de todos y puede contestarlos. Varios, separados por comas.
name: Worker

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: ¿Están las claves de Cloudflare?
        id: cf
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$T" ] || [ -z "$A" ]; then
            echo "::warning::Faltan CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID en los secretos: el Worker no se publica y la web solo enseña la liga de ejemplo"
            echo "ok=no" >> "$GITHUB_OUTPUT"
          else
            echo "ok=si" >> "$GITHUB_OUTPUT"
          fi
      - name: Almacén de los códigos
        if: steps.cf.outputs.ok == 'si'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          lista=$(npx --yes wrangler@4.158.0 kv namespace list 2>/dev/null || echo '[]')
          id=$(echo "$lista" | jq -r '.[]? | select(.title=="VINCULOS" or .title=="fantasy-manager-VINCULOS") | .id' 2>/dev/null | head -1)
          if [ -z "$id" ]; then
            salida=$(npx --yes wrangler@4.158.0 kv namespace create VINCULOS 2>&1 || true)
            id=$(echo "$salida" | grep -oE '[0-9a-f]{32}' | head -1)
          fi
          if [ -n "$id" ]; then
            printf '\n[[kv_namespaces]]\nbinding = "VINCULOS"\nid = "%s"\n' "$id" >> wrangler.toml
            echo "::notice::Almacén de códigos listo"
          else
            echo "::warning::No se ha podido crear el almacén KV (el token no tiene permiso de Workers KV): los códigos irán en la caché del Worker"
          fi
      - name: Publicar
        if: steps.cf.outputs.ok == 'si'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FM_ADMINS: ${{ secrets.FM_ADMINS }}
        run: |
          set -o pipefail
          extra=()
          adm=$(printf '%s' "$FM_ADMINS" | tr -cd '0-9,')
          if [ -n "$adm" ]; then extra=(--var "ADMINS:$adm"); echo "::notice::Avisos de fallos: con dueño"; else echo "::warning::Sin FM_ADMINS: los avisos de fallos se guardan, pero nadie los puede leer ni contestar desde la app"; fi
          publicar() { npx --yes wrangler@4.158.0 deploy "${extra[@]}" 2>&1 | tee salida.txt; }
          fallo() { grep -iE 'error|✘' salida.txt | head -3 | tr '\n' ' ' | cut -c1-300; }
          if ! publicar; then
            # los frenos por minuto (revisión total, C1): si Cloudflare no los deja crear, se publica sin ellos y el Worker
            # se queda con los de memoria y los topes por día del Durable Object
            if grep -q '^\[\[ratelimits\]\]' wrangler.toml; then
              echo "::warning::Sin Rate Limiting ($(fallo)): se prueba a publicar sin él"
              python3 - <<'PY'
          import re
          t = open('wrangler.toml').read()
          t = re.sub(r'\n# Los frenos por minuto.*?namespace_id = "7102"\nsimple = \{[^}]*\}\n', '\n', t, flags=re.S)
          open('wrangler.toml', 'w').write(t)
          PY
            fi
            if ! publicar; then
              # el QR va en un Durable Object (0.6.12): si Cloudflare no deja crearlo, se publica sin él y el QR va por el KV
              if grep -q 'durable_objects' wrangler.toml; then
                echo "::warning::Sin Durable Objects ($(fallo)): se publica sin ellos y el QR va por el KV (puede tardar hasta un minuto)"
                python3 - <<'PY'
          import re
          t = open('wrangler.toml').read()
          t = re.sub(r'\n# El QR para entrar.*?new_sqlite_classes = \[[^\]]*\]\n', '\n', t, flags=re.S)
          open('wrangler.toml', 'w').write(t)
          PY
                if ! publicar; then echo "::error::No se ha podido publicar: $(fallo)"; exit 1; fi
              else
                echo "::error::No se ha podido publicar: $(fallo)"; exit 1
              fi
            fi
          fi
          if grep -q '^\[\[ratelimits\]\]' wrangler.toml; then echo "::notice::Frenos por minuto: con Rate Limiting"; fi
          if grep -q 'durable_objects' wrangler.toml; then echo "::notice::QR del ordenador: con Durable Object"; fi
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' salida.txt | head -1)
          echo "::notice::Worker publicado en ${url:-(sin dirección workers.dev: actívala en Cloudflare > Workers)}"
      # El reloj del bot de X: el cron del Worker (wrangler.toml) lanza «Bot X» con este token. Se copia en cada publicación
      # para que un token nuevo en GitHub llegue al Worker sin más; el valor nunca sale en el log.
      - name: Token del reloj del bot
        if: steps.cf.outputs.ok == 'si'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOT_DISPATCH_TOKEN: ${{ secrets.BOT_DISPATCH_TOKEN }}
        run: |
          if [ -z "$BOT_DISPATCH_TOKEN" ]; then
            echo "::warning::Sin el secreto BOT_DISPATCH_TOKEN: el cron del Worker no lanza «Bot X»"
            exit 0
          fi
          if printf '%s' "$BOT_DISPATCH_TOKEN" | npx --yes wrangler@4.158.0 secret put BOT_DISPATCH_TOKEN > salida.txt 2>&1; then
            echo "::notice::Reloj del bot listo: el Worker lanza «Bot X» cada 5 min"
          else
            echo "::error::No se ha podido guardar BOT_DISPATCH_TOKEN en el Worker: $(grep -iE 'error|✘' salida.txt | head -3 | tr '\n' ' ' | cut -c1-300)"
            exit 1
          fi
