# Bot de la cuenta de X (@Fantasyman_app). Lo lanza cada 5 min el cron del Worker (worker/, BOT_DISPATCH_TOKEN), y de 00:13 a 00:30
# de Madrid, cada minuto, solo con el mercado (input «tipos»), para que salga en cuanto LaLiga actualiza los valores; el schedule de
# 15 min de aquí queda de respaldo (el de GitHub no disparaba). Según la variable de repositorio BOT_MODO:
#   (sin ella) o «simulacro»  genera y valida los tweets y los enseña en el resumen de la ejecución; NO publica
#   «publicar»                publica de verdad (hacen falta los 4 secretos de X) y guarda lo publicado en la rama bot-estado
#   «parado»                  no hace nada
# Los secretos son X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN y X_ACCESS_TOKEN_SECRET (Settings > Secrets and variables > Actions).
# «Run workflow» con «comprobar» marcado solo prueba que las claves valen (no publica). Detalle en bot/LEEME.md.
# Telegram (aparte de X, también con BOT_MODO=simulacro): con los secretos TELEGRAM_BOT_TOKEN y TELEGRAM_CHAT_ID manda a Carlos el
# texto de respuesta para el tuit de resultado de cada club y un aviso si falla la ejecución. Su registro (telegram.json) vive
# en la misma rama bot-estado. Sin esos secretos esos pasos no se ejecutan.
# Tarjetas con imagen: apagadas por defecto; se encienden en bot/config.json («tarjetas»: final y jugador). Detalle en bot/LEEME.md.
name: Bot X

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      comprobar:
        description: 'Solo comprobar las claves de X (no publica nada)'
        type: boolean
        default: false
      tipos:
        description: 'Solo estos tipos, separados por comas (vacío = todos). El Worker lanza «mercado» cada minuto de 00:13 a 00:30'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: bot-x
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT_MODO: ${{ vars.BOT_MODO || 'simulacro' }}
      BOT_LARGO: ${{ vars.BOT_LARGO || '' }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Noticias de prensa (bot/tipos/noticias.mjs): clave de Google AI Studio solo del bot. Sin ella, ese tipo no hace nada
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TIPOS: ${{ inputs.tipos }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Las tarjetas con imagen (bot/lib/con-tarjetas.mjs) necesitan @resvg/resvg-js: solo se instala si alguna está encendida
      # en bot/config.json («tarjetas»). Si la instalación falla, el bot sigue y los tweets salen sin imagen.
      - name: Instalar lo de las tarjetas (solo si están encendidas)
        if: ${{ !inputs.comprobar }}
        run: |
          if node -e "const t=require('./bot/config.json').tarjetas||{};const q=process.env.TIPOS;process.exit((q?q.split(',').some((k)=>t[k]||(k==='directo'&&t.jugador)):(t.final||t.jugador))?0:1)"; then
            npm ci --prefix bot --no-audit --no-fund || echo "No se pudo instalar: esta vez los tweets salen sin imagen"
          else
            echo "Tarjetas apagadas en bot/config.json: no instalo nada"
          fi
      - name: Comprobar las claves (sin publicar)
        if: ${{ inputs.comprobar }}
        run: node bot/ejecutar.mjs --comprobar=1
      - name: Traer el registro de lo publicado (al publicar en X o si hay Telegram)
        id: traer
        if: ${{ !inputs.comprobar && (env.BOT_MODO == 'publicar' || env.TELEGRAM_BOT_TOKEN != '') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf estado
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$URL" bot-estado >/dev/null 2>&1; then
            git clone -q --depth 1 --branch bot-estado "$URL" estado
          else
            mkdir estado && git -C estado init -q -b bot-estado && git -C estado remote add origin "$URL"
          fi
      - name: Bot
        if: ${{ !inputs.comprobar }}
        run: node bot/ejecutar.mjs --ventanas=1 --estado=estado/registro.json ${TIPOS:+--tipos=$TIPOS}
      # Telegram corre aunque el paso de X falle, pero no si no se ha podido traer el registro (mandaría otra vez lo ya mandado)
      - name: Respuestas para los clubes (Telegram)
        if: ${{ !cancelled() && !inputs.comprobar && !inputs.tipos && env.TELEGRAM_BOT_TOKEN != '' && steps.traer.outcome == 'success' }}
        run: node bot/telegram.mjs --ventanas=1 --estado=estado/telegram.json
      - name: Aviso de fallo (Telegram)
        if: ${{ failure() && !inputs.comprobar && env.TELEGRAM_BOT_TOKEN != '' && steps.traer.outcome == 'success' }}
        run: node bot/telegram.mjs --aviso=fallo --estado=estado/telegram.json
      - name: Guardar las tarjetas de esta ejecución (para verlas en Actions)
        if: ${{ always() && !inputs.comprobar && hashFiles('tarjetas/*.png') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: tarjetas-${{ github.run_id }}
          path: tarjetas/*.png
          retention-days: 7
      - name: Guardar el registro de lo publicado
        if: ${{ always() && !inputs.comprobar && steps.traer.outcome == 'success' }}
        run: |
          cd estado
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name='bot' -c user.email='bot@users.noreply.github.com' commit -q -m "Registro $(date -u +%FT%TZ)"
            # (5 nov, 17:01: GitHub dio un 500 al subir el registro, se perdió que Yuri ya había salido y a las 17:16 salió otra vez)
            # reintentos con espera; si la rama ha cambiado, se rehace encima
            for espera in 0 5 15 30 60 90; do
              sleep $espera
              if git push -q origin HEAD:bot-estado; then exit 0; fi
              git pull -q --rebase origin bot-estado || git rebase --abort || true
            done
            exit 1
          fi
