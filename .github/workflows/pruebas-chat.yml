# Solo en la rama pruebas-chat-haiku (no se fusiona): el chat con Haiku de verdad (.github/ia/chat-haiku.mjs) con la liga
# de ejemplo; deja las respuestas en .github/ia/respuestas-chat.md, en la misma rama, para leerlas.
name: Pruebas chat
on:
  push:
    branches: [pruebas-chat-haiku]
    paths-ignore: ['.github/ia/respuestas-chat.md', '.github/ia/respuestas-chat.json', '.github/ia/respuestas-medium.md', '.github/ia/respuestas-medium.json']
permissions:
  contents: write
concurrency: { group: pruebas-chat, cancel-in-progress: true }
jobs:
  chat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Playwright
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: El chat con Haiku
        run: PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/ia/chat-haiku.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ESFUERZOS: low
          ESCENAS: ${{ vars.CHAT_ESCENAS || 'martes,paron,sabado,trato-domy' }}
          TOPE_USD: "0.75"
          SOLO: ${{ vars.CHAT_SOLO || 'trueque-encadenado,trueque-sin-clausula,trueque-domy,trueque-domy-blinda' }}
      # (19 nov) las 10 más difíciles con esfuerzo medium, para comparar con las de low de arriba (solo para que decida Carlos)
      - name: Las 10 más difíciles con medium
        if: false
        run: PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/ia/chat-haiku.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ESFUERZOS: medium
          ESCENAS: martes
          SOLO: trueque,trato,cuanto-ofrezco,oferta-rival,quien-me-ataca,plan-por-que,que-hago-hoy,blindar,baja-vendo,apodo-dictado
          TOPE_USD: "0.15"
          SALIDA: .github/ia/respuestas-medium
      - name: Guardar las respuestas en la rama
        if: always()
        run: |
          [ -f .github/ia/respuestas-chat.md ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add .github/ia/respuestas-chat.md .github/ia/respuestas-chat.json .github/ia/respuestas-medium.md .github/ia/respuestas-medium.json 2>/dev/null || true
          git add .github/ia/respuestas-chat.md .github/ia/respuestas-chat.json
          git commit -q -m "Respuestas del chat con Haiku" || exit 0
          git push -q origin HEAD:pruebas-chat-haiku
