# Solo en la rama pruebas-chat-haiku (no se fusiona). CUESTA DINERO (la IA de verdad): no se sube nada a
# `pruebas-chat-haiku` sin que Carlos diga cuánto se puede gastar. Esta rama, `pruebas-chat-haiku-lista`, es la misma
# preparada y NO lanza nada. Para lanzarlo: git push -f origin origin/pruebas-chat-haiku-lista:pruebas-chat-haiku
# (25 nov, sesión B de la auditoría de fallos) el chat con Haiku de verdad (.github/ia/chat-haiku.mjs) sobre el código
# publicado (0.8.4j), solo con lo que la auditoría no pudo mirar: el dinero de un rival cerrado, que no nombre modelos,
# que no contradiga al plan y que tenga en cuenta lo que se le cuenta. Deja .github/ia/respuestas-chat.md y .json.
name: Pruebas chat
on:
  push:
    branches: [pruebas-chat-haiku]
    paths-ignore: ['.github/ia/respuestas-chat.md', '.github/ia/respuestas-chat.json']
permissions:
  contents: write
concurrency: { group: pruebas-chat, cancel-in-progress: true }
jobs:
  chat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Playwright
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: El chat con Haiku (ligas premium)
        run: PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/ia/chat-haiku.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ESFUERZOS: low
          ESCENAS: m-premium,sabado-premium,martes
          TOPE_USD: "1.00"
          SOLO: pm-capitan,pm-capitan-no-juega,pm-capitan-entrenador,pm-banquillo,pm-banquillo-regla,pm-entrenador,pm-entrenador-vendo,pm-entrenador-puntos,pm-tope,pm-formacion,pm-once,pm-ideal,pm-cesion,pm-que-hago,pm-fichar-ent,pm-fichar-ent-cuanto,pm-apagado-capitan,pm-estandar-capitan
      - name: Guardar las respuestas en la rama
        if: always()
        run: |
          [ -f .github/ia/respuestas-chat.md ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add .github/ia/respuestas-chat.md .github/ia/respuestas-chat.json
          git commit -q -m "Respuestas del chat con Haiku (ligas premium)" || exit 0
          git push -q origin HEAD:pruebas-chat-haiku
