# Solo en la rama pruebas-ia (no se fusiona): los planes del día con Haiku de verdad (.github/ia/planes-haiku.mjs) en las
# escenas de banco.mjs, aplicados como en la app; deja .github/ia/respuestas-planes.md y .json en la misma rama.
# (19 nov, tercera parte de la revisión de la IA; antes llamaba a llamar.mjs, llamar-claude.mjs y llamar-worker.mjs)
name: Pruebas IA
on:
  push:
    branches: [pruebas-ia]
    paths-ignore: ['.github/ia/respuestas-planes.md', '.github/ia/respuestas-planes.json']
permissions:
  contents: write
concurrency: { group: pruebas-ia, cancel-in-progress: true }
jobs:
  planes:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Playwright
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Los planes con Haiku
        run: PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/ia/planes-haiku.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOPE_USD: "0.4"
          WEB: "1"
      - name: Guardar las respuestas en la rama
        if: always()
        run: |
          [ -f .github/ia/respuestas-planes.md ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add .github/ia/respuestas-planes.md .github/ia/respuestas-planes.json
          git commit -q -m "Respuestas de los planes con Haiku" || exit 0
          git push -q origin HEAD:pruebas-ia
