# Solo en la rama pruebas-ia (no se fusiona): manda a Gemini lo que la app le mandaría en cada caso de .github/ia/casos.mjs
# y deja las respuestas como artefacto. Se puntúan fuera, con .github/ia/puntuar.mjs.
name: Pruebas IA
on:
  push:
    branches: [pruebas-ia]
permissions:
  contents: read
jobs:
  ia:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      # (14 nov) solo Claude: el cupo de Gemini de hoy ya está gastado
      - run: node .github/ia/llamar-claude.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: respuestas-claude, path: .github/ia/respuestas-claude.json, retention-days: 7 }
