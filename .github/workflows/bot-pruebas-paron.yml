# (9 nov, tarde: selecciones cada día con banderas y minutos, tarea 15)
# SOLO EN LA RAMA pruebas-paron: no va a main. Simulacro con la redacción de Claude de los datos variados del jugador (caídas, noticias,
# novedades) y de los cuatro tuits del parón, con datos reales y una copia del registro de bot-estado (no se guarda nada). NUNCA
# publica: sin claves de X y con --modo=simulacro. Selecciones mira el parón de septiembre-octubre (el de noviembre aún no se ha jugado).
name: Bot pruebas paron

on:
  push:
    branches: [pruebas-paron]

permissions:
  contents: read

concurrency:
  group: bot-pruebas-paron
  cancel-in-progress: true

jobs:
  simulacro:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BOT_IA: claude
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix bot --no-audit --no-fund
      - name: Registro de ahora (copia, solo lectura)
        run: |
          git clone -q --depth 1 --branch bot-estado "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/estado
          cp /tmp/estado/registro.json /tmp/registro.json
      - name: Sin separaciones y con topes altos (solo en esta copia del runner)
        run: |
          node -e "const f='bot/config.json',c=require('./'+f);c.maxPorEjecucion=7;c.topeDiario=200;c.separaciones={};for(const k of Object.keys(c.topes))c.topes[k]=50;require('fs').writeFileSync(f,JSON.stringify(c,null,1))"
      - name: Datos variados (caídas, noticias y novedades)
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "Falta el secreto ANTHROPIC_API_KEY"; exit 1; }
                    true
      - name: Selecciones cada día (tarea 15), cuatro días del parón de septiembre-octubre, y el de todo el parón
        run: |
          node bot/ejecutar.mjs --modo=simulacro --ventanas=0 --tipos=selecciones-dia --estado=/tmp/registro.json --redactar=1 --hechos=1 --tarjetas=1 --salida-tarjetas=/tmp/tj --fechas-selecciones=20260924,20260925,20260926 || true
          node bot/ejecutar.mjs --modo=simulacro --ventanas=0 --tipos=selecciones-dia --estado=/tmp/registro.json --redactar=1 --hechos=1 --tarjetas=1 --salida-tarjetas=/tmp/tj --fechas-selecciones=20260924,20260925,20260926,20260927,20260928,20260929 || true
          node bot/ejecutar.mjs --modo=simulacro --ventanas=0 --tipos=selecciones-dia --estado=/tmp/registro.json --redactar=1 --hechos=1 --tarjetas=1 --salida-tarjetas=/tmp/tj --fechas-selecciones=20260924,20260925,20260926,20260927,20260928,20260929,20261001,20261002,20261003 || true
          node bot/ejecutar.mjs --modo=simulacro --ventanas=0 --tipos=selecciones-dia --estado=/tmp/registro.json --redactar=1 --hechos=1 --tarjetas=1 --salida-tarjetas=/tmp/tj --fechas-selecciones=20260924,20260925,20260926,20260927,20260928,20260929,20261001,20261002,20261003,20261004,20261005,20261006 || true
          node bot/ejecutar.mjs --modo=simulacro --ventanas=0 --tipos=selecciones --estado=/tmp/registro.json --redactar=1 --hechos=1 --tarjetas=1 --salida-tarjetas=/tmp/tj --fechas-selecciones=20260924,20260925,20260926,20260927,20260928,20260929,20261001,20261002,20261003,20261004,20261005,20261006 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tarjetas-paron
          path: /tmp/tj
          if-no-files-found: ignore
