# Prueba (3 nov): rediseño «carta» de las tarjetas con datos reales, en simulacro (no publica). Dibuja todas las tarjetas
# (final, MVP y resumen de la J11, posibles onces de la J12, onces confirmados de la J11, mercado, caídas y novedades) y deja los
# PNG y el log en la rama pruebas-premium-salida. Solo en la rama pruebas-tarjetas-premium.
name: Premium prueba
on:
  push:
    branches: [pruebas-tarjetas-premium]
permissions:
  contents: write
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix bot --no-audit --no-fund
      - name: Tarjetas
        run: |
          S="--modo=simulacro --tarjetas=1 --forzar=1 --ventanas=0"
          ( node bot/ejecutar.mjs $S --tipos=mvp --jornada=11 || echo "FALLO mvp" ) 2>&1 | tee salida.txt
          ( node bot/ejecutar.mjs $S --tipos=resumen --jornada=11 || echo "FALLO resumen" ) 2>&1 | tee -a salida.txt
          grep -E "FALLA|FALLO|no pasa|inválid" salida.txt | head -40 || true
      - run: |
          mkdir out && cp tarjetas/*.png salida.txt out/ 2>/dev/null; cd out && ls | wc -l
          git init -q -b pruebas-premium-salida && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add . && git commit -qm "Prueba de las tarjetas carta" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/pruebas-premium-salida
