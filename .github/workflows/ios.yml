# La app de iOS (ios/): la misma web de web/ en un WKWebView con su puente. Aquí se compila para el simulador, sin
# certificados ni cuenta de Apple, y se prueba en el simulador (ios/Pruebas/PruebasUI.swift): arranca, la web servida por
# el esquema propio es un sitio seguro y guarda bien, «Entrar» abre la página de LaLiga, la liga de ejemplo pinta las 7
# pestañas y lo guardado aguanta al volver a abrir. (iOS 2) Y los avisos, el aviso del servidor y los anuncios (con la app
# y los bloques de prueba de Google). Las capturas y lo que cuenta la app quedan como artefacto.
# No firma, no sube nada a Apple y no publica nada. Solo en la rama `ios` (y a mano cuando el archivo esté en main).
name: App iOS

on:
  push:
    branches: [ios]
    paths: ['ios/**', 'web/**', '.github/paquete.py', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      solo:
        description: '«tienda»: solo compila y saca las capturas de la App Store (sin las pruebas de siempre)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # La web «publicada» de mentira con la que se prueba AlDia en el simulador: la de esta rama con otra versión (99.9.9),
  # con su paquete.json firmado con la clave de verdad. Va en Linux porque firmar-paquete.sh es de Linux. No se publica
  # en ningún sitio: se le pasa al otro trabajo, que la sirve en 127.0.0.1. Sin el secreto, AlDia no se prueba.
  remota:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: La web de mentira, firmada
        env:
          PAQUETE_FIRMA: ${{ secrets.PAQUETE_FIRMA }}
        run: |
          mkdir -p "$RUNNER_TEMP/remota"
          if [ -z "$PAQUETE_FIRMA" ]; then echo "::warning::Sin el secreto PAQUETE_FIRMA no se prueba AlDia en el simulador"; echo no > "$RUNNER_TEMP/remota/sin-firma"; exit 0; fi
          sed -i "s/^export const VERSION = '[^']*';/export const VERSION = '99.9.9';/" web/js/version.js
          grep -q "^export const VERSION = '99.9.9';" web/js/version.js
          python3 .github/paquete.py
          bash .github/firmar-paquete.sh web/paquete.json
          python3 - "$RUNNER_TEMP/remota" <<'PY'
          import json, os, shutil, sys
          paquete = json.load(open('web/paquete.json'))
          for rel in list(paquete['archivos']) + ['paquete.json', 'paquete.json.sig']:
              destino = os.path.join(sys.argv[1], rel)
              os.makedirs(os.path.dirname(destino), exist_ok=True)
              shutil.copyfile(os.path.join('web', rel), destino)
          print(paquete['version'], paquete['nativoIos'], len(paquete['archivos']), 'archivos')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-remota
          path: ${{ runner.temp }}/remota
          retention-days: 1

  simulador:
    needs: remota
    # Xcode 27 (SDK de iOS 27): Apple lo exige desde abril de 2027 (aviso ITMS-90725 del 27 nov 2026)
    runs-on: xcode-27
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ios-remota
          path: ${{ runner.temp }}/remota
      - name: Con qué se compila
        run: |
          sw_vers
          xcodebuild -version
          ls /Applications | grep -i '^Xcode' || true
          xcodebuild -showsdks | grep -i iphone || true
          SDK=$(xcodebuild -showsdks | grep -oE 'iphoneos[0-9]+' | head -1 | grep -oE '[0-9]+')
          [ "${SDK:-0}" -ge 27 ] || { echo "::error::El SDK de iPhone es el $SDK: hace falta el 27 o más"; exit 1; }
      # lo que tiene que ser igual que en Android: la clave pública que firma paquete.json y los sitios a los que la web
      # puede pedir por el puente
      - name: Lo mismo que en Android
        run: |
          J=$(grep -oE 'CLAVE_PAQUETE = "[A-Za-z0-9+/=]+"' android/app/src/main/java/es/fantasymanager/app/AlDia.java | cut -d'"' -f2)
          S=$(grep -oE 'clavePaquete = "[A-Za-z0-9+/=]+"' ios/App/Fuentes/AlDia.swift | cut -d'"' -f2)
          if [ -z "$J" ] || [ "$J" != "$S" ]; then echo "::error::La clave pública de paquete.json no es la misma en AlDia.java ($J) y en AlDia.swift ($S)"; exit 1; fi
          python3 - <<'PY'
          import re, sys
          j = open('android/app/src/main/java/es/fantasymanager/app/Puente.java', encoding='utf-8').read()
          s = open('ios/App/Fuentes/Red.swift', encoding='utf-8').read()
          dj = set(re.findall(r'"([a-z0-9.-]+\.[a-z]+)"', re.search(r'HOSTS = new HashSet<>\(Arrays\.asList\((.*?)\)\);', j, re.S).group(1)))
          ds = set(re.findall(r'"([a-z0-9.-]+\.[a-z]+)"', re.search(r'static let hosts: Set<String> = \[(.*?)\n    \]', s, re.S).group(1)))
          if dj != ds:
              sys.exit(f'::error::Los sitios del puente no son los mismos en Puente.java y en Red.swift: {sorted(dj ^ ds)}')
          print(f'{len(dj)} sitios, los mismos')
          PY
      # la web con sus huellas (como en «Web» y «App Android») y lo que va dentro de la app
      - name: La web
        run: |
          python3 .github/paquete.py >> "$GITHUB_ENV"
          python3 ios/preparar.py >> "$GITHUB_ENV"
      - name: El proyecto de Xcode
        run: |
          command -v xcodegen > /dev/null || brew install xcodegen
          xcodegen --version
          cd ios && xcodegen generate
      # La web de mentira, servida en este Mac (el simulador comparte su red). Solo para esta compilación de prueba se le
      # deja a la app hablar sin https con direcciones locales: el Info.plist del repo no cambia (y las huellas ya están
      # calculadas)
      - name: La web de mentira para AlDia
        run: |
          if [ -f "$RUNNER_TEMP/remota/paquete.json.sig" ]; then
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" ios/App/Info.plist
            (cd "$RUNNER_TEMP/remota" && nohup python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/remota.log" 2>&1 &)
            sleep 2
            curl -sf http://127.0.0.1:8765/paquete.json | head -c 120; echo
            echo "TEST_RUNNER_FM_REMOTA=http://127.0.0.1:8765/" >> "$GITHUB_ENV"
          else
            echo "::warning::AlDia no se prueba de punta a punta: no hay web de mentira firmada"
          fi
      - name: El simulador
        run: |
          xcrun simctl list devices available | grep -i iphone || true
          # el SDK entero (27.1): la imagen trae también simuladores de versiones beta más nuevas (con el 27.2 de Xcode 27.2
          # beta, el que lanza las pruebas se colgaba antes de empezar), así que se coge el de la misma versión o, si no hay,
          # el más nuevo que no pase del SDK
          SDK=$(xcodebuild -showsdks | grep -oE 'iphonesimulator[0-9]+\.[0-9]+' | head -1 | sed 's/iphonesimulator//')
          UDID=$(xcrun simctl list devices available -j | SDK="$SDK" python3 -c "
          import json, os, re, sys
          sdk = tuple(int(x) for x in (os.environ.get('SDK') or '0.0').split('.')[:2])
          mejor = None
          for rt, lista in json.load(sys.stdin)['devices'].items():
              m = re.search(r'iOS-(\d+)-(\d+)', rt)
              if not m:
                  continue
              v = (int(m.group(1)), int(m.group(2)))
              for d in lista:
                  if not d.get('isAvailable', True) or not d['name'].startswith('iPhone'):
                      continue
                  # el de la versión con la que se compila, y un iPhone normal (ni Pro Max, ni Plus, ni SE)
                  nota = (v == sdk, v <= sdk, bool(re.fullmatch(r'iPhone \d+( Pro)?', d['name'])), v if v <= sdk else (0, 0), d['name'])
                  if mejor is None or nota > mejor[0]:
                      mejor = (nota, d['udid'], d['name'], rt)
          if not mejor:
              sys.exit('No hay ningún simulador de iPhone')
          print(mejor[2], mejor[3], file=sys.stderr)
          print(mejor[1])
          ")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
      # (iOS 2) Mientras duran las pruebas, cada 5 s se le manda a la app del simulador un aviso «del servidor» de mentira
      # (`simctl push`: lo mismo que mandaría el Worker por APNs cuando el plan está listo, sin pasar por Apple). Con la app
      # abierta no se enseña; con la app fuera, la prueba lo busca y lo toca (test6AvisoDelServidor). Antes de que la app
      # tenga permiso de notificaciones no hace nada.
      - name: Compilar y probar en el simulador
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/push.apns" <<'JSON'
          {"aps":{"alert":{"title":"Tu plan de hoy está listo","body":"Vende a X y espera"},"sound":"default","thread-id":"plan"},"hash":"hoy","fm":"plan"}
          JSON
          ( while true; do xcrun simctl push "$UDID" es.fantasymanager.app "$RUNNER_TEMP/push.apns" > /dev/null 2>&1 || true; sleep 5; done ) &
          AVISOS=$!
          ACCION=(test -resultBundlePath "$RUNNER_TEMP/pruebas.xcresult" -test-timeouts-enabled YES
                  -maximum-test-execution-time-allowance 900 -skip-testing:FantasyManagerPruebas/Tienda)
          # (a mano con «solo: tienda»: solo se compila, para sacar las capturas de la App Store sin esperar a las pruebas)
          [ "${{ inputs.solo }}" = "tienda" ] && ACCION=(build-for-testing)
          xcodebuild "${ACCION[@]}" \
            -project ios/FantasyManager.xcodeproj -scheme FantasyManager \
            -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/dd" \
            MARKETING_VERSION="$FM_MARKETING" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            FM_VERSION="$FM_VERSION" FM_NATIVO="$NATIVO_IOS" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning: (unre|var|depre|reference)|Test Case|Test Suite|^=== |\*\* |XCTAssert" || true
          kill "$AVISOS" 2> /dev/null || true
          if [ "${ACCION[0]}" = test ]; then grep -q '\*\* TEST SUCCEEDED \*\*' "$RUNNER_TEMP/xcodebuild.log"; else grep -q '\*\* TEST BUILD SUCCEEDED \*\*' "$RUNNER_TEMP/xcodebuild.log"; fi
      # (iOS 6) Las capturas para la ficha de la App Store (ios/Pruebas/Tienda.swift), con lo ya compilado: un iPhone de 6,3"
      # y uno de 6,9" (lo que pide hoy App Store Connect), recién borrados, con la app en español y la barra de estado de las fotos
      # de Apple. Y la app en un iPad, en modo iPhone (los revisores a veces la prueban ahí): que arranque y se vea entera.
      # El trabajo «ficha» de testflight.yml las sube desde el artefacto «ios-tienda». Si algo de aquí falla, las pruebas
      # de siempre siguen valiendo
      - name: Capturas para la App Store
        continue-on-error: true
        timeout-minutes: 35
        run: |
          # como en «El simulador»: nunca uno de una versión más nueva que el SDK (las beta de la imagen)
          SDK=$(xcodebuild -showsdks | grep -oE 'iphonesimulator[0-9]+\.[0-9]+' | head -1 | sed 's/iphonesimulator//')
          buscar() { xcrun simctl list devices available -j | NOMBRES="$1" SDK="$SDK" python3 -c "
          import json, os, re, sys
          nombres = os.environ['NOMBRES'].split('|')
          sdk = tuple(int(x) for x in (os.environ.get('SDK') or '99.99').split('.')[:2])
          mejor = None
          for rt, lista in json.load(sys.stdin)['devices'].items():
              m = re.search(r'iOS-(\\d+)-(\\d+)', rt)
              if not m or (int(m.group(1)), int(m.group(2))) > sdk: continue
              for d in lista:
                  if d['name'] in nombres:
                      nota = (-nombres.index(d['name']), int(m.group(1)), int(m.group(2)))
                      if mejor is None or nota > mejor[0]: mejor = (nota, d['udid'], d['name'])
          if mejor: print(mejor[1]); print(mejor[2], file=sys.stderr)
          "; }
          preparar() {
            xcrun simctl shutdown "$1" 2> /dev/null || true
            xcrun simctl erase "$1"
            xcrun simctl boot "$1"; xcrun simctl bootstatus "$1" -b > /dev/null
            xcrun simctl status_bar "$1" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
              --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100 || true
          }
          OUT="$RUNNER_TEMP/tienda"; mkdir -p "$OUT"
          for par in "61|iPhone 17 Pro|iPhone 16 Pro|iPhone 15 Pro" "67|iPhone 17 Pro Max|iPhone 16 Pro Max|iPhone Air"; do
            K="${par%%|*}"; U=$(buscar "${par#*|}")
            [ -z "$U" ] && { echo "::warning::No hay simulador para las capturas de $K"; continue; }
            preparar "$U"
            xcodebuild test-without-building -project ios/FantasyManager.xcodeproj -scheme FantasyManager \
              -destination "id=$U" -derivedDataPath "$RUNNER_TEMP/dd" -resultBundlePath "$RUNNER_TEMP/tienda-$K.xcresult" \
              -only-testing:FantasyManagerPruebas/Tienda 2>&1 | grep -E "error:|Test Case|\*\* " || true
            mkdir -p "$OUT/$K" "$RUNNER_TEMP/adj-$K"
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/tienda-$K.xcresult" --output-path "$RUNNER_TEMP/adj-$K" || true
            python3 - "$RUNNER_TEMP/adj-$K" "$OUT/$K" <<'PY' || true
          import json, os, re, shutil, sys
          de, a = sys.argv[1], sys.argv[2]
          for prueba in json.load(open(os.path.join(de, 'manifest.json'))):
              for x in prueba.get('attachments', []):
                  base, ext = os.path.splitext(x.get('suggestedHumanReadableName') or x['exportedFileName'])
                  base = re.sub(r'_\d+_[0-9A-Fa-f-]{36}$', '', base)
                  if re.match(r'(\d+-[a-z]+|fallo)$', base):
                      shutil.copyfile(os.path.join(de, x['exportedFileName']), os.path.join(a, base + ext))
          PY
            ls "$OUT/$K"; sips -g pixelWidth -g pixelHeight "$OUT/$K"/*.png 2> /dev/null | grep pixel | sort | uniq -c || true
            xcrun simctl shutdown "$U" || true
          done
          # el iPad: la app de iPhone tal cual, abierta y con su captura a los 40 s
          U=$(buscar "iPad Pro 13-inch (M5)|iPad Pro 13-inch (M4)|iPad Air 13-inch (M3)|iPad Air 11-inch (M3)|iPad (A16)|iPad mini (A17 Pro)")
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name 'FantasyManager.app' -path '*iphonesimulator*' | head -1)
          if [ -n "$U" ] && [ -n "$APP" ]; then
            # (con 8 min como mucho: la primera vez que arranca un iPad el simulador puede quedarse preparándolo)
            ( preparar "$U"
              xcrun simctl install "$U" "$APP"
              xcrun simctl launch "$U" es.fantasymanager.app -AppleLanguages "(es)" -AppleLocale es_ES
              sleep 40
              mkdir -p "$OUT/ipad"
              xcrun simctl io "$U" screenshot "$OUT/ipad/1-arranque.png"
              xcrun simctl spawn "$U" launchctl list | grep -q es.fantasymanager.app && echo "iPad: la app sigue abierta" || echo "::warning::iPad: la app no sigue abierta"
            ) & IPAD=$!
            for i in $(seq 1 96); do kill -0 "$IPAD" 2> /dev/null || break; sleep 5; done
            kill -0 "$IPAD" 2> /dev/null && { kill "$IPAD"; echo "::warning::iPad: no ha arrancado en 8 min"; }
            xcrun simctl shutdown "$U" 2> /dev/null || true
          else
            echo "::warning::No hay simulador de iPad (o no encuentro la app compilada)"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ios-tienda
          path: ${{ runner.temp }}/tienda
          retention-days: 30
          if-no-files-found: ignore
      # las capturas y lo que ha contado la app, también si la prueba falla
      - name: Sacar las capturas
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/salida/capturas"
          if [ -d "$RUNNER_TEMP/pruebas.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/pruebas.xcresult" --output-path "$RUNNER_TEMP/adjuntos" || true
            python3 - "$RUNNER_TEMP/adjuntos" "$RUNNER_TEMP/salida/capturas" <<'PY' || true
          import json, os, re, shutil, sys
          de, a = sys.argv[1], sys.argv[2]
          vistos = {}
          for prueba in json.load(open(os.path.join(de, 'manifest.json'))):
              for x in prueba.get('attachments', []):
                  nombre = x.get('suggestedHumanReadableName') or x['exportedFileName']
                  # «1-entrada_0_UUID.png» → «1-entrada.png» (y «-2», «-3» si se repite)
                  base, ext = os.path.splitext(nombre)
                  base = re.sub(r'_\d+_[0-9A-Fa-f-]{36}$', '', base)
                  # solo lo que apuntan las pruebas (lo demás lo añade Xcode por su cuenta y lleva nombres que no se pueden subir)
                  if not re.match(r'(\d+-|fallo)', base):
                      continue
                  base = re.sub(r'[^A-Za-z0-9._ -]', '_', base)
                  vistos[base] = vistos.get(base, 0) + 1
                  if vistos[base] > 1:
                      base += f'-{vistos[base]}'
                  shutil.copyfile(os.path.join(de, x['exportedFileName']), os.path.join(a, base + ext))
                  print(base + ext)
          PY
          fi
          tail -c 400000 "$RUNNER_TEMP/xcodebuild.log" > "$RUNNER_TEMP/salida/xcodebuild-final.log" || true
          grep -nE "error:|: error|\*\* " "$RUNNER_TEMP/xcodebuild.log" | head -200 > "$RUNNER_TEMP/salida/errores.txt" || true
          cp "$RUNNER_TEMP/remota.log" "$RUNNER_TEMP/salida/servidor-aldia.log" 2> /dev/null || true
          # el vídeo de la pantalla pesa mucho y no hace falta
          find "$RUNNER_TEMP/salida/capturas" -name '*.mp4' -delete || true
          ls -la "$RUNNER_TEMP/salida/capturas" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ios-simulador
          path: ${{ runner.temp }}/salida
          retention-days: 14
