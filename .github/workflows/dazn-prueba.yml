name: DAZN prueba
on:
  push:
    branches: [pruebas-dazn2]
permissions:
  contents: read
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix bot --no-audit --no-fund
      - name: simulacro
        run: mkdir -p salida && node bot/ejecutar.mjs --modo=simulacro --jornada=11 --tipos=mercado,final,mvp,resumen,directo --ventanas=0 --fechas-espn=20261102 --tarjetas=1 --salida-tarjetas=salida/tarjetas > salida/sal.txt 2>&1 || true
        shell: bash
      - name: ver
        run: sed 's/^/@@ /' salida/sal.txt
      - uses: actions/upload-artifact@v4
        with:
          name: salida
          path: salida
          retention-days: 2
