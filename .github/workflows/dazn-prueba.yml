name: DAZN prueba
on:
  push:
    branches: [pruebas-dazn2]
permissions:
  contents: read
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node bot/prueba/sonda-mercado.mjs
