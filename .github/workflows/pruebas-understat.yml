name: Pruebas understat
on:
  push:
    branches: [pruebas-understat]
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Histórico de valor de LaLiga
        run: |
          for id in 68 2759 3134 856; do
            curl -s -m 30 -H 'User-Agent: Mozilla/5.0' "https://fantasy-api.llt-services.com/api/v1/competition/1/player/$id/market-value?x-lang=es" -o v.json
            echo "@@ $id: $(node -e 'const v=JSON.parse(require("fs").readFileSync("v.json","utf8"));const l=Array.isArray(v)?v:(v.data||[]);console.log(l.length+" puntos, primero "+JSON.stringify(l[0])+", segundo "+JSON.stringify(l[1])+", último "+JSON.stringify(l[l.length-1]))' 2>&1 | head -c 400)"
          done
          curl -s -m 30 -H 'User-Agent: Mozilla/5.0' "https://fantasy-api.llt-services.com/api/v3/player/68/market-value?x-lang=es" -o v3.json; echo "@@ v3: $(head -c 200 v3.json)"
