name: Pruebas understat
on:
  push:
    branches: [pruebas-understat]
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Understat
        run: |
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36'
          pedir() { curl -s -m 30 -A "$UA" -o "$2" -w '%{http_code} %{size_download} %{content_type}' "${@:3}" "$1"; }
          for u in https://understat.com/ https://understat.com/league/La_liga https://understat.com/league/La_liga/2026 https://understat.com/getLeagueData/La_liga/2026 https://understat.com/main/getLeagueData/La_liga/2026; do
            echo "@@ $u => $(pedir $u x.html -H 'Accept: text/html,application/json') final=$(curl -s -m 20 -A "$UA" -o /dev/null -w '%{url_effective} %{redirect_url}' -L $u)"
            echo "@@   texto: $(sed 's/<[^>]*>/ /g' x.html | tr -s ' \n\t' ' ' | head -c 400)"
            echo "@@   vars: $(grep -o '[a-zA-Z]*Data *= *JSON\|getLeagueData[^\"]\{0,60\}' x.html | sort -u | head -5 | tr '\n' ' ')"
          done
