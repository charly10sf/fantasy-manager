# Publica la versión web (la carpeta web/, la misma que va dentro de la app) en GitHub Pages:
# https://charly10sf.github.io/fantasy-manager/ y, con el dominio en GitHub Pages (el plan de claude/BLOQUEO-LALIGA.md,
# para que con partidos no lo corten), https://fantasymanagerapp.com. Hace falta una vez: Settings > Pages > Source:
# «GitHub Actions» (y el dominio en «Custom domain»). Lleva también lo que antes solo subía dominio.yml a Cloudflare:
# app.json y el APK en /descargas/ (ads.txt y app-ads.txt ya van en web/). Por eso se vuelve a lanzar al acabar
# «App Android» en main: es cuando cambian app.json y el APK.
name: Web

on:
  push:
    branches: [main]
    # también cuando cambia la parte Android: así el paquete.json publicado lleva su huella nueva
    paths: ['web/**', 'android/app/src/**', 'android/build.gradle', 'android/settings.gradle', 'android/gradle.properties',
            'android/app/build.gradle', 'android/app/reglas-r8.pro', 'android/prueba/**', '.github/paquete.py',
            '.github/firmar-paquete.sh', '.github/prueba-web.mjs', '.github/workflows/web.yml']
  workflow_run:
    workflows: ["App Android"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # antes de publicar, la web se abre de verdad (revisión total, A13): la demo arranca, las 7 pestañas pintan sin
  # .error-c, una liga guardada rota no bloquea, la red colgada tiene salida y el almacenamiento lleno no pierde la
  # sesión. Si falla, no se publica nada (.github/prueba-web.mjs)
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Playwright y Chromium
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Probar la web
        run: PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/prueba-web.mjs

  publicar:
    needs: probar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      # web/paquete.json: lo que la app compara con lo que trae dentro para ponerse al día sin reinstalar
      - name: Huellas
        run: python3 .github/paquete.py
      # la firma de paquete.json (revisión total, A5): sin ella las apps nuevas no bajan nada. Sin el secreto
      # PAQUETE_FIRMA, o si la clave no casa con la pública de AlDia.java, falla aquí y no se publica
      - name: Firma del paquete
        env:
          PAQUETE_FIRMA: ${{ secrets.PAQUETE_FIRMA }}
        run: bash .github/firmar-paquete.sh web/paquete.json
      # después de las huellas: no van en paquete.json (AlDia no las baja), solo se sirven
      - name: app.json y el APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app.json web/app.json
          mkdir -p web/descargas
          gh release download app -p fantasy-manager.apk -D web/descargas -R "${{ github.repository }}" || echo "::warning::No se ha podido bajar el APK de la release"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web
      - id: pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5