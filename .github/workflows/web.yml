# Publica la versión web (la carpeta web/, la misma que va dentro de la app) en GitHub Pages:
# https://charly10sf.github.io/fantasy-manager/
# Hace falta una vez: Settings > Pages > Source: «GitHub Actions».
name: Web

on:
  push:
    branches: [main]
    # también cuando cambia la parte Android: así el paquete.json publicado lleva su huella nueva
    paths: ['web/**', 'android/app/src/**', '.github/paquete.py', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # web/paquete.json: lo que la app compara con lo que trae dentro para ponerse al día sin reinstalar
      - name: Huellas
        run: python3 .github/paquete.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: pages
        uses: actions/deploy-pages@v4
