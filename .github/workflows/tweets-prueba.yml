name: Tweets prueba
on:
  push:
    branches: [pruebas-tweets-humanos]
permissions:
  contents: write
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix bot --no-audit --no-fund
      - name: paginas de onces reales
        run: |
          mkdir -p salida-tarjetas
          for e in athletic real-madrid espanyol valencia; do curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36" -H "Accept-Language: es-ES" "https://www.futbolfantasy.com/laliga/equipos/$e" -o salida-tarjetas/$e.html; done
          ls -la salida-tarjetas | sed 's/^/@@ /'
      - name: tarjetas a la rama pruebas-bajas2-salida
        if: always()
        run: |
          cd salida-tarjetas || exit 0
          git init -q -b pruebas-bajas2-salida && git add -A
          git -c user.name=bot -c user.email=bot@example.com commit -qm "tarjetas de prueba"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:pruebas-bajas2-salida
