# Las pruebas en cada push (revisión total, A13), en cualquier rama menos bot-estado (la escribe el bot cada 5 min):
#   web: la misma prueba de la web que hace «Web» antes de publicar (.github/prueba-web.mjs) y los casos de la IA sin
#     red (.github/prueba-ia.mjs);
#   sin-red: worker/prueba/datos.mjs y las bot/prueba/*-ejemplo.mjs con la red cortada (.github/pruebas-sin-red.sh).
#   firma: Ed25519.java (el que comprueba paquete.json en el APK) contra los vectores del RFC 8032 y, con el secreto
#     PAQUETE_FIRMA, firma el paquete.json de esta rama y lo verifica con la clave pública de AlDia.java, igual que
#     «Web» antes de publicar (revisión total, A5). Sin el secreto, falla: así se ve antes de llegar a main.
# No publica nada.
name: Pruebas

on:
  push:
    branches-ignore: [bot-estado]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Playwright y Chromium
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Probar la web
        run: PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/prueba-web.mjs
      # los fallos reales de la IA (plan y chat), con Google de mentira: la app tiene que pararlos (.github/ia/casos.mjs)
      - name: Probar la IA sin red
        run: PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/prueba-ia.mjs

  sin-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Dependencias del bot
        run: npm ci --prefix bot --no-audit --no-fund
      # un espacio de red sin nada más que lo (127.0.0.1, para los servidores falsos de las pruebas)
      - name: Worker y bot, con la red cortada
        run: sudo unshare --net sh -c 'ip link set lo up && PATH="$0" sh .github/pruebas-sin-red.sh' "$PATH"

  firma:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Ed25519.java con los vectores del RFC 8032
        run: |
          javac -nowarn -d "$RUNNER_TEMP/firma" android/app/src/main/java/es/fantasymanager/app/Ed25519.java android/prueba/PruebaFirma.java
          java -cp "$RUNNER_TEMP/firma" es.fantasymanager.app.PruebaFirma
      - name: Firmar y comprobar con la clave de verdad
        env:
          PAQUETE_FIRMA: ${{ secrets.PAQUETE_FIRMA }}
        run: |
          python3 .github/paquete.py > /dev/null
          bash .github/firmar-paquete.sh web/paquete.json
