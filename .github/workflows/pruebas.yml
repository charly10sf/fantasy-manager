# Las pruebas en cada push (revisión total, A13), en cualquier rama menos bot-estado (la escribe el bot cada 5 min):
#   web: la misma prueba de la web que hace «Web» antes de publicar (.github/prueba-web.mjs);
#   sin-red: worker/prueba/datos.mjs y las bot/prueba/*-ejemplo.mjs con la red cortada (.github/pruebas-sin-red.sh).
# No publica nada.
name: Pruebas

on:
  push:
    branches-ignore: [bot-estado]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright y Chromium
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Probar la web
        run: PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/prueba-web.mjs

  sin-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencias del bot
        run: npm ci --prefix bot --no-audit --no-fund
      # un espacio de red sin nada más que lo (127.0.0.1, para los servidores falsos de las pruebas)
      - name: Worker y bot, con la red cortada
        run: sudo unshare --net sh -c 'ip link set lo up && PATH="$0" sh .github/pruebas-sin-red.sh' "$PATH"
