# Las pruebas en cada push (revisión total, A13), en cualquier rama menos bot-estado (la escribe el bot cada 5 min):
#   web: la misma prueba de la web que hace «Web» antes de publicar (.github/prueba-web.mjs) y los casos de la IA sin
#     red (.github/prueba-ia.mjs), el plan con cientos de ligas al azar (.github/ia/azar-plan.mjs), el chat con la IA
#     de la app (.github/ia/caso-chat.mjs) y los intersticiales de Google Play (.github/prueba-intersticial.mjs);
#   sin-red: worker/prueba/datos.mjs y las bot/prueba/*-ejemplo.mjs con la red cortada (.github/pruebas-sin-red.sh).
#   firma: Ed25519.java (el que comprueba paquete.json en el APK) contra los vectores del RFC 8032 y, con el secreto
#     PAQUETE_FIRMA, firma el paquete.json de esta rama y lo verifica con la clave pública de AlDia.java, igual que
#     «Web» antes de publicar (revisión total, A5). Sin el secreto, falla: así se ve antes de llegar a main. Desde el
#     19 nov, también Origenes.java (AlDia va al respaldo de Cloudflare Pages si no llega al dominio).
# No publica nada.
name: Pruebas

on:
  push:
    branches-ignore: [bot-estado]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # WebKit es el motor de Safari: la entrada del iPhone no la puede probar nadie en un móvil de verdad, así que se prueba aquí
      - name: Playwright, Chromium y WebKit
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Probar la web
        run: PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/prueba-web.mjs
      # (0.8l) la entrada de la web de punta a punta (abrir LaLiga, copiar, pegar) en iPhone, ordenador y Android, sin tocar LaLiga
      - name: Probar la entrada de la web
        run: PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/prueba-entrada.mjs
      # los fallos reales de la IA (plan y chat), con Google de mentira: la app tiene que pararlos (.github/ia/casos.mjs)
      - name: Probar la IA sin red
        run: PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/prueba-ia.mjs
      # el plan a prueba de azar: cientos de ligas removidas, y el plan (el de la app y el de la IA) tiene que salir siempre
      - name: Probar el plan con ligas al azar
        run: PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/ia/azar-plan.mjs 60 1
      # (0.8) el chat con la IA de la app de punta a punta (servidor de mentira) y los intersticiales de Google Play
      - name: Probar el chat con la IA de la app
        run: PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/ia/caso-chat.mjs
      - name: Probar los intersticiales
        run: PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/prueba-intersticial.mjs
      - name: La tarjeta de una novedad no se pierde (invitar a un amigo)
        run: PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/prueba-aviso.mjs
      # el plan con la IA de la app cuando la conexión falla a medias: siempre queda el de la app, con un aviso que dice la verdad
      - name: Probar el plan cuando falla la conexión
        run: PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/ia/caso-conexion.mjs
      # Hoy y los avisos con la app cerrada dicen lo mismo de a quién vender por la inercia
      - name: Probar los avisos de vender por la inercia
        run: PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/ia/caso-fondo.mjs
      # (20 nov) el peligro de cada rival: lo que puede hacerte y lo que suele hacer, con rivales forzados
      - name: Peligro de los rivales
        run: PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/ia/caso-peligro.mjs
      # (21 nov) lo medido con la liga de Carlos: el que se frena no se vende antes de girar y el partido que acaba de jugar
      # mueve lo que se espera de su valor (y Hoy lo dice al proponer clausularlo)
      - name: La inercia medida y el partido de la jornada
        run: PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/ia/caso-directo.mjs
      # (20 nov) vender o quedárselo: las cuentas y el veredicto que le llegan al chat, con jugadores forzados
      - name: Vender o quedárselo
        run: PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/ia/caso-ventas.mjs
      # (23 nov, Gulácsi) una oferta por un titular de tu once que no baja todos los días: esperar, salvo un 10 % o más,
      # que esté de baja o que haga falta el dinero
      - name: La oferta por un titular
        run: PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/ia/caso-oferta-titular.mjs
      # (0.8y) al que baja con la cláusula por encima de lo que da LaLiga no se le blinda
      - name: No blindar al que baja
        run: PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/ia/caso-no-blindar.mjs
      # (0.8z) al barato que baja se le vende por la inercia (el corte, un 3 % de lo que vale)
      - name: Vender al barato que baja
        run: PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/ia/caso-venta-barato.mjs
      # (0.8z) el cambio: vender al titular que baja y pujar por su recambio, y la oferta solo con el recambio dentro
      - name: El cambio por un recambio
        run: PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/ia/caso-cambio.mjs
      # (0.8a) los nombres de los rivales mal dictados y los apodos
      - name: Apodos y nombres aproximados
        run: PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/ia/caso-apodos.mjs
      # (19 nov, tercera parte de la revisión de la IA) cada regla del árbitro con un plan que se la salta, y que Hoy, Equipo,
      # el plan y lo que se le pasa al chat digan lo mismo de cada jugador
      - name: El árbitro y la coherencia entre pantallas
        run: |
          PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/ia/caso-arbitro.mjs
          PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/ia/caso-coherencia.mjs
          PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/ia/caso-dicho.mjs
          PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/ia/caso-dinero.mjs
          PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/ia/caso-sinc.mjs
          PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/ia/caso-irreal.mjs
          PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/ia/caso-homonimos.mjs
          PW_MODULO="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node .github/ia/caso-trato.mjs

  sin-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Dependencias del bot
        run: npm ci --prefix bot --no-audit --no-fund
      # un espacio de red sin nada más que lo (127.0.0.1, para los servidores falsos de las pruebas)
      - name: Worker y bot, con la red cortada
        run: sudo unshare --net sh -c 'ip link set lo up && PATH="$0" sh .github/pruebas-sin-red.sh' "$PATH"

  firma:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Ed25519.java con los vectores del RFC 8032
        run: |
          javac -nowarn -d "$RUNNER_TEMP/firma" android/app/src/main/java/es/fantasymanager/app/Ed25519.java android/prueba/PruebaFirma.java
          java -cp "$RUNNER_TEMP/firma" es.fantasymanager.app.PruebaFirma
      # (19 nov) de dónde baja AlDia la web: el dominio y, si no se llega a él, el respaldo (servidores https locales)
      - name: AlDia con el dominio caído (Origenes.java)
        run: |
          A=android/app/src/main/java/es/fantasymanager/app
          javac -nowarn -d "$RUNNER_TEMP/origenes" $A/Ed25519.java $A/Origenes.java android/prueba/PruebaOrigenes.java
          java -cp "$RUNNER_TEMP/origenes" es.fantasymanager.app.PruebaOrigenes
      - name: Firmar y comprobar con la clave de verdad
        env:
          PAQUETE_FIRMA: ${{ secrets.PAQUETE_FIRMA }}
        run: |
          python3 .github/paquete.py > /dev/null
          bash .github/firmar-paquete.sh web/paquete.json
