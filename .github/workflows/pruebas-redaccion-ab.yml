# SOLO EN LA RAMA pruebas-redaccion-ab (no se fusiona). La prueba de Haiku del bot (25-26 nov, claude/bot-haiku-25nov.md del proyecto):
# los mismos tuits reales con los mismos hechos y la misma prensa, redactados por cuatro variantes (A como ahora, B Haiku redacta y
# Sonnet revisa, C Haiku en todo, D Haiku en todo con más esfuerzo) con la IA de verdad, y lo que se mide solo.
# El material (los tuits con sus hechos de `ejecutar.mjs --volcar`, la J13 y lo de entre semana, y los «recientes» de antes de cada
# tuit) está en .github/ia/haiku/; aquí solo se añaden las noticias, que hay que clasificar con la IA. Lo de antes de esta prueba (la
# A/B de la guía del 22 nov) queda en .github/ia/ab-redaccion*.md. Tope de gasto: TOPE_USD para TODO (clasificar las noticias incluido).
name: Pruebas redaccion A/B
on:
  push:
    branches: [pruebas-redaccion-ab]
    paths-ignore: ['.github/ia/ab-redaccion*.md', '.github/ia/ab-redaccion*.json', '.github/ia/haiku/pasada*', '.github/ia/haiku/medida*', '.github/ia/haiku/noticias.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: pruebas-redaccion-ab, cancel-in-progress: false }
jobs:
  haiku:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      BOT_IA: claude
      TOPE_USD: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: npm ci --prefix bot --no-audit --no-fund
      - name: Si ya está hecha, no se repite (no se gasta dos veces)
        id: hecha
        run: |
          if [ -f .github/ia/haiku/pasada.json ]; then echo "La pasada ya está en la rama: borra .github/ia/haiku/pasada.json para repetirla"; echo "si=1" >> "$GITHUB_OUTPUT"; fi
      - name: Las noticias de entre semana (con el registro del 24 nov, solo lectura; clasificar con Haiku)
        if: steps.hecha.outputs.si != '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "Falta el secreto ANTHROPIC_API_KEY"; exit 1; }
          git fetch -q origin bot-estado --shallow-since="2026-11-22"
          C=$(git rev-list -1 --before="2026-11-24T06:00:00Z" FETCH_HEAD)
          git show "$C:registro.json" > /tmp/registro-24.json
          node bot/ejecutar.mjs --modo=simulacro --ventanas=0 --tipos=noticias --estado=/tmp/registro-24.json --volcar=.github/ia/haiku/noticias.json > /tmp/noticias.txt 2>&1 || true
          grep -E "^## |\(ia\) gasto" /tmp/noticias.txt | tail -5
          G=$(node -e "const s=require('fs').readFileSync('/tmp/noticias.txt','utf8').split('\n').filter(l=>l.includes('(ia) gasto de hoy')).pop()||''; const m=s.match(/([0-9.]+) \\\$\s*$/); console.log(m?m[1]:'0')")
          echo "GASTO_NOTICIAS=${G:-0}" >> "$GITHUB_ENV"
          echo "Clasificar las noticias: ${G:-0} $"
      - name: El material, con las noticias
        if: steps.hecha.outputs.si != '1'
        run: node bot/prueba/haiku-material.mjs .github/ia/haiku .github/ia/haiku/noticias.json --solo-noticias
      - name: Las cuatro variantes con la IA de verdad
        if: steps.hecha.outputs.si != '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          T=$(node -e "console.log(Math.max(0, Number(process.env.TOPE_USD) - Number(process.env.GASTO_NOTICIAS || 0) - 0.03).toFixed(3))")
          echo "Tope para la pasada: $T $"
          node bot/prueba/ab-modelos.mjs --material=.github/ia/haiku/material.json --dir=.github/ia/haiku --salida=.github/ia/haiku/pasada --tope="$T"
      - name: Lo que se mide solo
        if: always() && steps.hecha.outputs.si != '1'
        run: |
          [ -f .github/ia/haiku/pasada.json ] || exit 0
          node bot/prueba/haiku-medir.mjs .github/ia/haiku/pasada.json .github/ia/haiku/medida .github/ia/haiku/material.json > /dev/null
          head -60 .github/ia/haiku/medida.md
      - name: Guardar en la rama
        if: always() && steps.hecha.outputs.si != '1'
        run: |
          [ -f .github/ia/haiku/pasada.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add .github/ia/haiku/
          git commit -q -m "Prueba de Haiku: la pasada con la IA de verdad" || exit 0
          git push -q origin HEAD:pruebas-redaccion-ab
