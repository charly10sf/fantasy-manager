name: Sonda DAZN
on:
  push:
    branches: [pruebas-dazn]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node bot/prueba/sonda-dazn.mjs
