# Las acciones de los workflows van fijadas por SHA (revisión total, M2). Dependabot propone una vez al mes, en una
# sola PR, subir esos SHA (y la etiqueta del comentario) a la última versión. No fusiona nada solo.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      acciones:
        patterns: ["*"]
    # las versiones grandes (v4 → v5), a mano: pueden cambiar cómo funcionan
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
